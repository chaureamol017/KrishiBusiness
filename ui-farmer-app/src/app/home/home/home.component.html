<div class="layout">
    <!-- Header -->
    <header class="header">
      <button class="toggler" (click)="toggleSidebar()">☰</button>
      <div class="logo">
        <img src="assets/logo.png" alt="Logo" class="logo-img" />
        <span class="app-name">{{ appName }}</span>
      </div>
      <div class="auth-buttons">
        <button *ngIf="!isLoggedIn" class="btn" (click)="login()">Login</button>
        <button *ngIf="!isLoggedIn" class="btn" (click)="signUp()">Sign Up</button>
        <div *ngIf="isLoggedIn" class="profile">
          <span>{{ userName }}</span>
          <button class="btn" (click)="logout()">Logout</button>
        </div>
      </div>
    </header>
  
    <!-- Sidebar -->
    <aside class="sidebar" [class.hidden]="!isSidebarVisible">
      <nav>
        <ul>
          <li><a href="#">Dashboard</a></li>
          <li><a href="#">Products</a></li>
          <li><a href="#">Orders</a></li>
          <li><a href="#">Settings</a></li>
        </ul>
      </nav>
    </aside>
  
    <!-- Main Content -->
    <main class="content">
      <h1>{{ heading }}</h1>
      <p>{{ description1 }}</p>
    </main>
  
    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2025 Krishi Business. All rights reserved.</p>
    </footer>
  </div>
