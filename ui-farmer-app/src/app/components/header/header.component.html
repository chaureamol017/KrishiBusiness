
<header class="header">
    <button class="toggler" (click)="toggleSidebar()">☰</button>
    <div class="logo">
      <img src="assets/logo.png" alt="Logo" class="logo-img" />
      <span class="app-name">{{ appName }}</span>
    </div>
    <div class="auth-buttons">
      <button *ngIf="!isLoggedIn" class="btn" (click)="login()">Login</button>
      <button *ngIf="!isLoggedIn" class="btn" (click)="signUp()">Sign Up</button>
      <div *ngIf="isLoggedIn" class="profile">
        <span>{{ userName }}</span>
        <button class="btn" (click)="logout()">Logout</button>
      </div>
    </div>
  </header>
