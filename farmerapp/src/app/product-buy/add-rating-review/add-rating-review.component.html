<h2 mat-dialog-title>{{ formTitle }}</h2>
<mat-dialog-content>
  <!-- Average Rating -->
  <div class="avg-rating" *ngIf="averageRating > 0">
    <span>Seller Average Rating: <strong>{{ averageRating }}/5</strong></span>
  </div>

  <!-- Existing Reviews -->
  <div class="reviews-list" *ngIf="reviews.length > 0">
    <h3>Reviews ({{ reviews.length }})</h3>
    <div class="review-item" *ngFor="let r of reviews">
      <div class="review-header">
        <strong>{{ r.reviewerName }}</strong>
        <span class="rating-stars">
          <mat-icon *ngFor="let s of [1,2,3,4,5]" [class.filled]="s <= r.rating">star</mat-icon>
        </span>
      </div>
      <p class="review-text">{{ r.review }}</p>
      <small class="review-date">{{ r.createdOn | date:'dd-MM-yyyy' }}</small>
    </div>
  </div>

  <div *ngIf="reviews.length === 0" class="no-reviews">
    <p>No reviews yet. Be the first to review!</p>
  </div>

  <!-- Add Review Form -->
  <h3>Add Your Review</h3>
  <form [formGroup]="reviewForm" class="review-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Rating (1-5)</mat-label>
      <input matInput type="number" formControlName="rating" min="1" max="5">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Review</mat-label>
      <textarea matInput formControlName="review" rows="3" placeholder="Write your review..."></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onClose()">Close</button>
  <button mat-raised-button color="primary" (click)="submitReview()" [disabled]="reviewForm.invalid">Submit Review</button>
</mat-dialog-actions>
