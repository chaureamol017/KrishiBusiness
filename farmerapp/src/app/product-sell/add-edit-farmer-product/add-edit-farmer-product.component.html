<app-top-dialog-content [title]="formTitle" (closeClick)="closeDialog()"></app-top-dialog-content>

    <form [formGroup]="productDetailsform" class="dialog-content">
        <div class="form-group">
            <label for="name">Product</label>
            <select class="form-control" formControlName="productId" data-toggle="tooltip"
                data-placement="right" title="Select Product" placeholder="Select Product">
                <option *ngFor="let product of products" value="{{product.productId}}">{{product.name}} ({{product.category}})</option>
            </select>
        </div>
        <div class="form-group">
            <label for="name">Product Description</label>
            <input type="text" class="form-control" formControlName="description" data-toggle="tooltip"
                data-placement="right" title="Enter Product Description">
        </div>

        <div class="form-group">
            <label for="name">Quantity</label>
            <input type="number" class="form-control" formControlName="quantity" data-toggle="tooltip"
                data-placement="right" title="Enter Product Quantity">
        </div>

        <div class="form-group">
            <label for="quantityUnit">Quantity Unit</label>
            <select class="form-control" formControlName="quantityUnit" data-toggle="tooltip"
                data-placement="right" title="Select Product category">
                <option *ngFor="let quantityUnit of quantityUnits" value="{{quantityUnit}}">{{quantityUnit}}</option>
            </select>
        </div>

        <div class="form-group">
            <label for="name">Price Per Unit</label>
            <input type="number" class="form-control" formControlName="pricePerUnit" data-toggle="tooltip"
                data-placement="right" title="Enter Price">
        </div>

        <div class="form-group">
            <label for="city">City</label>
            <input type="text" class="form-control" formControlName="city" data-toggle="tooltip" data-placement="right"
                title="Enter City">
        </div>
    </form>

<div class="dialog-footer">
    <button type="submit" class="btn btn-success" (click)="addEditProduct()">Submit</button>
</div>
