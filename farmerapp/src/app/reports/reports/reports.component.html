<mat-tab-group class="reports-tab-group" animationDuration="200ms">

  <mat-tab *ngIf="showAdminReport" label="Admin Overview">
    <div class="tab-content">
      <app-admin-report></app-admin-report>
    </div>
  </mat-tab>

  <mat-tab *ngIf="showSellerReport" label="Seller Report">
    <div class="tab-content">
      <app-seller-report></app-seller-report>
    </div>
  </mat-tab>

  <mat-tab *ngIf="showBuyerReport" label="Purchase Report">
    <div class="tab-content">
      <app-buyer-report></app-buyer-report>
    </div>
  </mat-tab>

</mat-tab-group>
