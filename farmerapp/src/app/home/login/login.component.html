<app-top-dialog-content [titleBarColor]="primary" [title]="formTitle" (closeClick)="closeDialog()"></app-top-dialog-content>

<form [formGroup]="loginForm" class="dialog-content">
    <div class="form-group">
        <label for="emailId">Email address</label>
        <input type="email" class="form-control" id="emailId" formControlName="userName"
            aria-describedby="emailHelp" placeholder="Enter email">
        <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" formControlName="password" placeholder="Password">
    </div>
</form>

<div class="dialog-footer-bottom-stretch">
  <button type="submit" class="btn btn-primary btn-block" (click)="validateLogin(loginForm)">Login</button>
</div>
