<mat-nav-list>
    <app-profile-card></app-profile-card>
    <mat-divider></mat-divider>
    <mat-list role="list">

        <mat-list-item *ngFor="let navLink of navLinks" [class.active-nav-link]="isActiveLink(navLink)" (click)="onClickNavLink(navLink)">
            <mat-icon *ngIf="navLink.icon">{{ navLink.icon }}</mat-icon>
            {{ navLink.title }}
        </mat-list-item>
      </mat-list>
    <mat-divider></mat-divider>

</mat-nav-list>
