<div class="container" fxLayout="column" fxLayoutAlign="center stretch" fxLayoutGap="20px">
    <app-banner *ngIf="hasBanners()" [banners]="banners"></app-banner>
    <app-banner-card [title]="appName" [description]="cardDescription" [cards]="cards"></app-banner-card>

    <div fxLayout="column" fxLayoutAlign="space-between center" style="padding: 0 15%;">
        <h5 *ngFor="let detail of detailArr">{{detail}}</h5>
    </div>
</div>
