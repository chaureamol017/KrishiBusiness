<app-top-dialog-content [titleBarColor]="primary" [title]="formTitle"
    (closeClick)="closeDialog()"></app-top-dialog-content>

<form class="dialog-content" [formGroup]="signupForm">
    <div class="form-group">
        <label class="form-label" for="role">Registration For</label>
        <select class="form-control" id="role" formControlName="role" data-toggle="tooltip" data-placement="right"
            title="Select Registration For">
            <option value="">-- Please Select --</option>
            <option value="BUYER">Buyer</option>
            <option value="SELLER">Seller</option>
            <option value="BOTH">Both</option>
            <option value="ADMIN">Admin</option>
        </select>
    </div>
    <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" class="form-control" id="firstName" formControlName="firstName"
            placeholder="Enter First Name">
    </div>
    <div class="form-group">
        <label for="middleName">Middle Name</label>
        <input type="text" class="form-control" id="middleName" formControlName="middleName"
            placeholder="Enter Middle Name">
    </div>
    <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" class="form-control" id="lastName" formControlName="lastName" placeholder="Enter Last Name">
    </div>
    <div class="form-group">
        <label for="exampleInputEmail1">Email address</label>
        <input type="email" class="form-control" id="exampleInputEmail1" formControlName="emailId"
            aria-describedby="emailHelp" placeholder="Enter email">
        <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone
            else.</small>
    </div>
    <div class="form-group">
        <label for="signupUserPassword">Password</label>
        <input type="password" class="form-control" id="signupUserPassword" formControlName="password"
            placeholder="password">
    </div>
    <div class="form-group">
        <label for="signupUserConfirmPassword">Re-Password</label>
        <input type="password" class="form-control" id="signupUserConfirmPassword" formControlName="confirmPassword"
            placeholder="Confirm Password">
    </div>
</form>

<div class="dialog-footer-bottom-stretch">
    <button type="submit" class="btn btn-primary btn-block" (click)="signupUser(signupForm)">Sign Up</button>
</div>
